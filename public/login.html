<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - واتس اب المدارس</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body style="align-items: center; justify-content: center;">

    <div class="glass-card" style="width: 100%; max-width: 400px; text-align: center;">
        <h2 style="margin-bottom: 2rem;">أهلاً بك مجدداً 👋</h2>

        <form id="login-form">
            <input type="text" id="username" placeholder="اسم المستخدم" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" style="width: 100%;">تسجيل الدخول 🔐</button>
        </form>
        <p id="error-msg" style="color: var(--danger); margin-top: 1rem; display: none;"></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorMsg.innerText = data.error || 'خطأ في بيانات الدخول';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = 'خطأ في الاتصال';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
