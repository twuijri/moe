<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم العليا - Super Admin</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: block;
            padding: 2rem;
            min-height: 100vh;
        }

        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            align-items: start;
        }

        .super-header {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 800;
        }

        /* Sidebar Styling */
        .sidebar {
            background: rgba(255, 255, 255, 0.05);
            /* Lighter glass */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            height: fit-content;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .nav-link {
            display: block;
            padding: 1rem 1.5rem;
            color: #ddd;
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 0.8rem;
            transition: all 0.3s;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(-5px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, rgba(37, 211, 102, 0.2), transparent);
            color: #25d366;
            border-right: 3px solid #25d366;
        }

        /* Action Buttons */
        .action-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            margin: 0 4px;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .btn-extend {
            background: rgba(37, 211, 102, 0.2);
            color: #25d366;
        }

        .btn-delete {
            background: rgba(255, 95, 95, 0.2);
            color: #ff5f5f;
        }

        .btn-edit {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #1f2937;
            /* Solid dark background fallback */
            background: rgba(30, 40, 50, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: modalSlide 0.3s ease-out;
            position: relative;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px) scale(0.95);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Table enhancements */
        table {
            border-collapse: separate;
            border-spacing: 0 0.5rem;
        }

        th {
            color: #888;
            font-weight: 600;
            padding-bottom: 1rem;
            border: none;
        }

        td {
            background: rgba(255, 255, 255, 0.03);
            border: none;
            padding: 1.2rem;
        }

        tr td:first-child {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        tr td:last-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2 class="super-header">👑 Super Admin</h2>
            <nav>
                <a href="#" class="nav-link active" onclick="showSection('tenants')">👥 المشتركين</a>
                <a href="#" class="nav-link" onclick="logout()">🚪 تسجيل الخروج</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <header>
                <h1>إدارة المشتركين</h1>
                <button class="primary-btn" onclick="openAddModal()">➕ إضافة مشترك جديد</button>
            </header>

            <!-- Tenants List -->
            <div id="tenants-view" class="view-section active">
                <div class="glass-card" style="padding: 0; background: transparent; box-shadow: none; border: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم المشترك</th>
                                <th>الرابط (Slug)</th>
                                <th>مدير النظام</th>
                                <th>الجوال</th>
                                <th>الاشتراك ينتهي</th>
                                <th>المتبقي</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="tenants-table-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Add Tenant Modal -->
    <div id="add-tenant-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; text-align: center;">إضافة مشترك جديد ✨</h2>

            <div class="form-group">
                <label>اسم المشترك / المدرسة</label>
                <input type="text" id="new-name" placeholder="مثال: مدارس الأفق">
            </div>

            <div class="form-group">
                <label>الرابط (Slug)</label>
                <input type="text" id="new-slug" placeholder="مثال: alofuq (انجليزي فقط)">
                <small style="color: #aaa; display: block; margin-top: 5px; direction: ltr;">URL:
                    domain.com/alofuq</small>
            </div>

            <div class="form-group">
                <label>اسم المستخدم (Admin)</label>
                <input type="text" id="new-admin-user" placeholder="admin">
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="new-admin-pass" placeholder="******">
            </div>

            <div class="form-group">
                <label>رقم الجوال (للتواصل)</label>
                <input type="text" id="new-phone" placeholder="9665...">
            </div>

            <div class="form-group">
                <label>مدة الاشتراك (يوم)</label>
                <input type="number" id="new-days" value="30">
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button class="primary-btn" onclick="addTenant()" style="flex: 2;">إضافة</button>
                <button class="danger-btn" onclick="closeModal()"
                    style="flex: 1; background: transparent; border: 1px solid #666;">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Edit Tenant Modal -->
    <div id="edit-tenant-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; text-align: center;">تعديل المشترك ✏️</h2>
            <input type="hidden" id="edit-id">

            <div class="form-group">
                <label>اسم المشترك</label>
                <input type="text" id="edit-name">
            </div>

            <div class="form-group">
                <label>الرابط (Slug)</label>
                <input type="text" id="edit-slug">
            </div>

            <div class="form-group">
                <label>اسم المستخدم (Admin)</label>
                <input type="text" id="edit-admin-user">
            </div>

            <div class="form-group">
                <label>كلمة المرور الجديدة (اتركها فارغة لعدم التغيير)</label>
                <input type="password" id="edit-admin-pass" placeholder="******">
            </div>

            <div class="form-group">
                <label>رقم الجوال</label>
                <input type="text" id="edit-phone">
            </div>

            <div class="form-group">
                <label>تاريخ انتهاء الاشتراك</label>
                <input type="date" id="edit-subscription-end"
                    style="color-scheme: dark; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; width: 100%;">
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button class="primary-btn" onclick="submitEdit()" style="flex: 2;">حفظ التعديلات</button>
                <button class="danger-btn" onclick="document.getElementById('edit-tenant-modal').style.display='none'"
                    style="flex: 1; background: transparent; border: 1px solid #666;">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Extend Subscription Modal (Kept for Quick Extend) -->
    <div id="extend-modal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h3 style="margin-bottom: 1rem;">تجديد الاشتراك 📅</h3>
            <p id="extend-tenant-name"
                style="color: #25d366; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem;"></p>

            <input type="hidden" id="extend-tenant-id">
            <div class="form-group">
                <label>عدد الأيام الإضافية</label>
                <input type="number" id="extend-days" value="30" style="text-align: center; font-size: 1.5rem;">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="primary-btn" onclick="submitExtend()" style="flex: 1;">تأكيد التجديد</button>
                <button class="danger-btn" onclick="document.getElementById('extend-modal').style.display='none'"
                    style="flex: 1;">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="super.js"></script>
</body>

</html>
