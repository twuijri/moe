version: '3.8'

services:
  app:
    build: .
    container_name: whatsapp_saas_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./src:/usr/src/app/src
      - ./public:/usr/src/app/public
      - whatsapp_session:/usr/src/app/.wwebjs_auth
      - whatsapp_data:/usr/src/app/data
    environment:
      - NODE_ENV=production

volumes:
  whatsapp_session:
  whatsapp_data:
